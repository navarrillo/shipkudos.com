name: Manual load test
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Isolated instance URL (never an unrelated website)
        required: true
        type: string
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run tests/load/public.js
