name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm test
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      infrastructure: ${{ steps.paths.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: paths
        with:
          filters: |
            infrastructure:
              - '**/Dockerfile*'
              - '**/*compose*.yml'
              - '**/*compose*.yaml'
              - 'bin/**'
              - 'migrations/**'
              - '.github/workflows/**'
              - 'src/**'
              - 'tests/integration/**'
              - 'src/lib/github.ts'
  heavy:
    needs: [quick, changes]
    if: ${{ !failure() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.infrastructure == 'true') }}
    uses: ./.github/workflows/heavy.yml
    with:
      publish: false
